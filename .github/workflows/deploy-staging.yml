name: Deploy Staging

# Reproducible: push a main (o disparo manual) -> validación -> build:staging -> deploy -> health.
# NO producción, NO custom domain, NO preview environments (MVP Bloque 6).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue de staging a la vez; no cancelar uno en curso.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Protege la IP canónica jurídica (repo/agents) contra cambios no autorizados.
      - name: Canonical agent tree guard
        run: node scripts/check-agent-tree.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `test:ci` = vitest run --dangerouslyIgnoreUnhandledErrors: ignora el crash de
      # teardown de fork ambiental (FULL_VITEST_TEARDOWN_ENVIRONMENTAL_ISSUE) SIN ocultar
      # fallos de aserción (verificado: exit 0 con tests ok, exit 1 ante un assertion failure).
      - name: Tests
        run: pnpm test:ci

      - name: Build staging
        run: pnpm build:staging

      # Deploy safety: valida el artifact real (name/IUSIA_ENV=staging/APP_URL/D1 id/
      # AI_SEARCH/R2/sin secretos ni placeholders ni account antiguo) antes de desplegar.
      - name: Deploy safety guard (artifact)
        run: node scripts/check-staging-artifact.mjs

      - name: Deploy to Cloudflare (staging)
        run: pnpm deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        run: |
          url="https://iusia-staging.edergope.workers.dev/api/health"
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q '"env":"staging"' /tmp/health.json; then
              echo "✓ health 200 env=staging"; cat /tmp/health.json; exit 0
            fi
            echo "intento $i: HTTP $code"; sleep 5
          done
          echo "✘ health check falló"; cat /tmp/health.json 2>/dev/null || true; exit 1
